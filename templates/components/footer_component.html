{% load render_partial %}
{% load static %}

<script src="{% static 'newsletter_module/news_letter.js' %}"></script>


<footer id="footer">
	<div class="footer-Before">
		<div class="container">
			<div class="block-news">
				<div class="row">
					<h3>با عضویت در خبـرنامه ما از تخفیفات ویـژه ما با خبـر شوید ... </h3>
					<div class="searchform newslatter">
						<input id="news_letter_email" placeholder="آدرس ایمیـل شما ..."/>
						<button onclick="AddToNewsLetter()" class="btn btn-default">
							<i class="fa fa-arrow-circle-o-left"></i>
						</button>
					</div>

				</div>
			</div>
		</div>
	</div>

	<div class="footer-top">
		<div class="container">
			<div class="row">
				<div class="col-sm-3">
					<div class="address">
						<img src="/static/images/home/map.png" alt="">
					</div>
				</div>
				<div class="col-sm-3">
					<div class="address">
						<img src="/static/images/home/map.png" alt="">
					</div>
				</div>
				<div class="col-sm-6">
					<div class="companyinfo">
						<a href="{% url "home_page" %}">
							<img src="{{ setting.site_logo.url }}" alt="site-logo">
						</a>
						<h4>درباره ما :</h4>
						<p>
							{{ setting.about_us }}
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="footer-widget">
		<div class="container">
			<div class="row">
				<div class="col-sm-3">
					<div class="single-widget">
						<ul class="nav nav-pills nav-stacked" id="footer-nav">
							<li><a href="{% url 'about_us_page' %}">درباره ما</a></li>
							<li><a href={% url 'contact_page' %}>تماس با ما</a></li>
							<li><a href="{% url 'product_page' %}">لیست محصولات</a></li>
							<li><a href="{% url 'news_page' %}">لیست مقالات</a></li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="footer-bottom" style="direction: ltr !important;">
		<div class="container">
			<div class="row">
				<p class="pull-left">Copyright © 2025
					{{ setting.copy_right }}
				</p>
			</div>
		</div>
	</div>
</footer>

<script src="{% static 'newsletter_module/news_letter.js' %}"></script>
