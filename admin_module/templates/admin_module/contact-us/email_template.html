<html>
<head>
	<title>تایید حساب کاربری</title>
	<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .email-container {
            width: 100%;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .email-content {
            width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 24px;
            text-align: center;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #FE980F;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 30px;
        }

        .footer a {
            color: #FE980F;
            text-decoration: none;
        }
	</style>
</head>
<body>
<div class="email-container">
	<div class="email-content">
		<h1>پاسخ پیام</h1>
		<p>سلام،</p>
		<p>
			پاسخ پیام شما
		</p>
		<p>
			{{ answer_text }}
		</p>
		<div class="footer">
			<p>با تشکر، فروشگاه اینترنتی </p>
		</div>
	</div>
</div>
</body>
</html>
