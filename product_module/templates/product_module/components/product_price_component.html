{% load static %}
{% csrf_token %}

<!--price-range-->
<div class="price-range">
	<h2>
		فیلتـر قیمـت
	</h2>
	<div class="well">
		<div class="slider slider-horizontal" style="width: 166px;">
			<div class="slider-track">
				<div class="slider-selection" style="left: 0%; width: 0.025%;"></div>
				<div class="slider-handle round left-round" style="left: 0%;"></div>
				<div class="slider-handle round" style="left: 0.025%;"></div>
			</div>
			<div class="tooltip top in" style="top: -30px; left: -26.4793px;">
				<div class="tooltip-arrow"></div>
				<div class="tooltip-inner">0 : 250</div>
			</div>
			<input type="text" class="span2" value="" data-slider-min="0" data-slider-max="1000000" data-slider-step="5"
			       data-slider-value="[250,450]" id="sl2" style="">
		</div>
		<br>
		<b>1.000.000 ريال</b> <b class="pull-left">0 ريال</b>

		<button id="price_filter_btn"
		        class="btn-success center-block margin-top-30"
		        style="margin-top: 30px; border-radius: 5px; padding: 5px; border:none;">
			اعمال فیلتر
		</button>

	</div>
</div>

<script src="/static/js/main.js"></script>
<script src="{% static 'js/price_filter.js' %}"></script>
