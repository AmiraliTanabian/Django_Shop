{% extends "base.html" %}
{% block title %}
ثبت نام | فروشگاه اینترنتی
{% endblock %}
{% block content %}
    <section id="form">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-3">
                <div class="signup-form"><!--sign up form-->
                    <h2>ثبت نام کاربـر جدیـد</h2>
                    <form action="#">
                        <input type="text" placeholder="نام کاربـری">
                        <input type="email" placeholder="آدرس ایمیـل">
                        <input type="password" placeholder="رمـز عبـور">
                        <button type="submit" class="btn btn-default">ثبت نام</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
