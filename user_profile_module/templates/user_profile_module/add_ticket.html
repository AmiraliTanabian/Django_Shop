{% extends "base.html" %}
{% block title %}
	ثبت تیکت
{% endblock %}
{% block content %}

	{% include "components/message.html" %}

	<div class="container">
		<div class="contact-form">
			<div class="row">
				<div class="col-sm-8">
					{% csrf_token %}
					<form class="contact-form" name="contact-form" method="post" enctype="multipart/form-data">
						{% csrf_token %}
						{{ form }}

						<input type="hidden" name="attachment_filenames" id="attachment-filenames-input">

						<button type="submit" class="btn btn-primary" style="float:left; margin-bottom: 30px;">ارسال
						</button>

					</form>
				</div>
				<div class="col-sm-4">
					{% include "user_profile_module/components/profile_dashboard_menu_component.html" %}
				</div>
			</div>
		</div>
	</div>

{% endblock %}
